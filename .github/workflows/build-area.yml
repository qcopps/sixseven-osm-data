name: build-area

# Builds the venue files of ONE area (an emirate, an airport...) for the Six-seven app.
# On a push, the job is described by area/job.env (EXTRACT, CODE, ISO, CITY, AREA_TAGS, STREET).
# Data © OpenStreetMap contributors, ODbL.

on:
  workflow_dispatch:
    inputs:
      extract: { description: 'Geofabrik extract path', default: 'asia/gcc-states' }
      code: { description: 'File code', default: 'dxb' }
      iso: { description: 'ISO3166-2 of the area', default: 'AE-DU' }
      city: { description: 'Town name written on every venue', default: 'Dubai' }
      area_tags: { description: 'Select the area by tags instead (k=v,k=v)', default: '' }
      street: { description: 'Street written on every venue', default: '' }
  push:
    branches: [main]
    paths: ['.github/workflows/build-area.yml', 'area/job.env', 'area/extract_area.py']

permissions:
  contents: write

concurrency:
  group: build-area
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Load the job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "EXTRACT=${{ inputs.extract }}"
              echo "CODE=${{ inputs.code }}"
              echo "ISO=${{ inputs.iso }}"
              echo "CITY=${{ inputs.city }}"
              echo "AREA_TAGS=${{ inputs.area_tags }}"
              echo "STREET=${{ inputs.street }}"
            } >> "$GITHUB_ENV"
          else
            grep -E '^(EXTRACT|CODE|ISO|CITY|AREA_TAGS|STREET)=' area/job.env >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: pip install osmium==4.3.2 shapely
      - name: Download the Geofabrik extract
        run: |
          mkdir -p dl out
          curl -fsSL --retry 3 --retry-delay 30 -A "sixseven-osm-data (GitHub Actions)" \
            -o dl/extract.osm.pbf "https://download.geofabrik.de/${EXTRACT}-latest.osm.pbf"
          ls -la dl
      - name: Extract venues, addresses and roads
        run: |
          set -o pipefail
          python3 -I area/extract_area.py dl/extract.osm.pbf out "$CODE" "$ISO" "$CITY" --en \
            ${AREA_TAGS:+"--area-tags=$AREA_TAGS"} ${STREET:+"--street=$STREET"} 2>&1 | tee "out/log_${CODE}.txt"
      - name: Commit the files
        if: always()
        run: |
          mkdir -p data logs
          cp out/${CODE}_* data/ 2>/dev/null || true
          cp out/log_* logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          git commit -m "Venue files for ${CITY} ${STREET} (data © OpenStreetMap contributors, ODbL)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
